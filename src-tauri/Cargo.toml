[package]
name = "serialclon"
description = "An independent reimplementation of the Serial Cloner DNA cloning workbench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[lib]
# Separate lib name so the binary and library targets never collide on Windows.
name = "serialclon_lib"

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
serde.workspace = true
serde_json.workspace = true
sc-seq.workspace = true
sc-enzyme.workspace = true
sc-format.workspace = true
sc-clone.workspace = true
sc-features.workspace = true
sc-align.workspace = true
sc-net.workspace = true
base64 = "0.22"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"

[lints]
workspace = true
