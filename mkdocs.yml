site_name: SerialClon.rs
site_description: An open-source, maintained reimplementation of Serial Cloner — the DNA cloning workbench — in Rust + Tauri
site_author: luksgrin
site_url: https://luksgrin.github.io/SerialClon.rs/

repo_name: luksgrin/SerialClon.rs
repo_url: https://github.com/luksgrin/SerialClon.rs
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.annotate
    - content.code.copy

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Installation: installation.md
  - Getting started: getting-started.md
  - Windows:
      - Sequence Window: windows/sequence-window.md
      - Graphic Map: windows/graphic-map.md
      - Sequence Map: windows/sequence-map.md
      - Features: windows/features.md
      - Cloning: windows/cloning.md
      - Alignment: windows/alignment.md
      - Protein: windows/protein.md
      - Web Access: windows/web-access.md
      - Preferences: windows/preferences.md
      - Keyboard shortcuts: shortcuts.md
  - File formats: file-formats.md
  - Migration from Serial Cloner: migration.md
  - Data: data.md
  - Development: development.md

plugins:
  - search

copyright: SerialClon.rs contributors — MIT OR Apache-2.0. Not affiliated with Serial Cloner / SerialBasics.
