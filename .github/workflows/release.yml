# Builds installers for every platform (PLAN.md §5).
#
# - On a `v*` tag: creates a draft GitHub Release and uploads the bundles plus
#   the updater's `latest.json`.
# - On push to main, pull requests and manual runs: builds and uploads the
#   bundles as workflow artifacts, no release.
#
# Signing is intentionally absent until M7. Without it the app still builds;
# users just get the Gatekeeper / SmartScreen prompt the original had.
# When ready, add these to `env:` of the build step from repository secrets:
#   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#   APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID, TAURI_SIGNING_PRIVATE_KEY,
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD.
name: Installers

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            slug: macos-aarch64
            os: macos-14
            args: --target aarch64-apple-darwin --bundles app,dmg
            targets: aarch64-apple-darwin
          - name: macOS (Intel)
            slug: macos-x86_64
            os: macos-14
            args: --target x86_64-apple-darwin --bundles app,dmg
            targets: x86_64-apple-darwin
          - name: macOS (Universal)
            slug: macos-universal
            os: macos-14
            args: --target universal-apple-darwin --bundles app,dmg
            targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: Windows (x86_64)
            slug: windows-x86_64
            os: windows-latest
            args: --bundles msi,nsis
            targets: x86_64-pc-windows-msvc
          - name: Ubuntu 22.04 (x86_64)
            slug: ubuntu-22.04-x86_64
            os: ubuntu-22.04
            args: --bundles deb,appimage
            targets: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install system dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          key: ${{ matrix.slug }}

      - name: Frontend — install
        run: npm ci

      - name: Build installers
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          # Empty tagName = build only, no release.
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: SerialClon.rs ${{ github.ref_name }}
          releaseBody: |
            SerialClon.rs ${{ github.ref_name }} — installers for macOS (`.dmg`, Apple Silicon / Intel / Universal), Windows (`.msi`, NSIS `.exe`) and Ubuntu (`.deb`, `.AppImage`).

            The installers are **not code-signed**. The first launch needs one unblocking step: on macOS, right-click the app ▸ Open (or run `xattr -cr "/Applications/SerialClon.rs.app"`); on Windows, choose "More info ▸ Run anyway". Step-by-step instructions with screenshots: https://luksgrin.github.io/SerialClon.rs/installation/

            What changed: see CHANGELOG.md.
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          uploadWorkflowArtifacts: true
          # One artifact per bundle type. Both macOS arches build on the same arm64
          # runner, so `[arch]` would collide; the matrix slug is the explicit arch.
          workflowArtifactNamePattern: serialclon-${{ matrix.slug }}-[bundle]
