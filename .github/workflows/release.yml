# Builds installers for every platform and drafts the GitHub Release
# (PLAN.md §5). Manual only: Actions ▸ Installers ▸ Run workflow.
#
# The run refuses to start unless the version in src-tauri/tauri.conf.json,
# the workspace Cargo.toml and package.json agree and is newer than the
# latest `v*` tag; the release is created as a draft under `v<version>` and
# the tag appears when the draft is published. Bundles are also uploaded as
# workflow artifacts.
#
# Signing is intentionally absent. Without it the app still builds; users
# just get the Gatekeeper / SmartScreen prompt the original had (the
# installation page explains the unblocking step).
name: Installers

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: Mark the draft release as a pre-release
        type: boolean
        default: false

concurrency:
  group: installers
  cancel-in-progress: false

jobs:
  version:
    name: Check the version
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Read and compare the version
        id: read
        run: |
          set -euo pipefail
          conf=$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          cargo=$(python3 -c "
          import re, pathlib
          t = pathlib.Path('Cargo.toml').read_text()
          m = re.search(r'^\[workspace\.package\](.*?)^\[', t, re.S | re.M)
          print(re.search(r'^version\s*=\s*\"([^\"]+)\"', m.group(1), re.M).group(1))")
          npm=$(python3 -c "import json; print(json.load(open('package.json'))['version'])")
          echo "tauri.conf.json $conf / Cargo.toml $cargo / package.json $npm"
          if [ "$conf" != "$cargo" ] || [ "$conf" != "$npm" ]; then
            echo "::error::the three manifests disagree on the version"; exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$conf" >/dev/null; then
            echo "::error::tag v$conf already exists — bump the version before releasing"; exit 1
          fi
          latest=$(git tag -l 'v*' | sed 's/^v//' | sort -V | tail -1)
          if [ -n "$latest" ]; then
            newest=$(printf '%s\n%s\n' "$latest" "$conf" | sort -V | tail -1)
            if [ "$newest" != "$conf" ]; then
              echo "::error::version $conf is not newer than the latest release v$latest"; exit 1
            fi
          fi
          echo "version=$conf" >> "$GITHUB_OUTPUT"
          echo "Releasing v$conf (latest so far: ${latest:-none})"

  build:
    name: ${{ matrix.name }}
    needs: version
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            slug: macos-aarch64
            os: macos-14
            args: --target aarch64-apple-darwin --bundles app,dmg
            targets: aarch64-apple-darwin
          - name: macOS (Intel)
            slug: macos-x86_64
            os: macos-14
            args: --target x86_64-apple-darwin --bundles app,dmg
            targets: x86_64-apple-darwin
          - name: macOS (Universal)
            slug: macos-universal
            os: macos-14
            args: --target universal-apple-darwin --bundles app,dmg
            targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: Windows (x86_64)
            slug: windows-x86_64
            os: windows-latest
            args: --bundles msi,nsis
            targets: x86_64-pc-windows-msvc
          - name: Ubuntu 22.04 (x86_64)
            slug: ubuntu-22.04-x86_64
            os: ubuntu-22.04
            args: --bundles deb,appimage
            targets: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install system dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          key: ${{ matrix.slug }}

      - name: Frontend — install
        run: npm ci

      - name: Build installers
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          tagName: v${{ needs.version.outputs.version }}
          releaseName: SerialClon.rs v${{ needs.version.outputs.version }}
          releaseBody: |
            SerialClon.rs v${{ needs.version.outputs.version }} — installers for macOS (`.dmg`, Apple Silicon / Intel / Universal), Windows (`.msi`, NSIS `.exe`) and Ubuntu (`.deb`, `.AppImage`).

            The installers are **not code-signed**. The first launch needs one unblocking step: on macOS, right-click the app ▸ Open (or run `xattr -cr "/Applications/SerialClon.rs.app"`); on Windows, choose "More info ▸ Run anyway". Step-by-step instructions with screenshots: https://luksgrin.github.io/SerialClon.rs/installation/

            What changed: see CHANGELOG.md.
          releaseDraft: true
          prerelease: ${{ inputs.prerelease }}
          uploadWorkflowArtifacts: true
          # One artifact per bundle type. Both macOS arches build on the same arm64
          # runner, so `[arch]` would collide; the matrix slug is the explicit arch.
          workflowArtifactNamePattern: serialclon-${{ matrix.slug }}-[bundle]
